<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","url":"https://www.honeymooners.travel/policies/faq","inLanguage":"en","about":{"@id":"https://www.honeymooners.travel/#organization"},"mainEntity":[{"@type":"Question","name":"What is Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"We are a travel agency specialized in creating personalized experiences for couples on their honeymoon, romantic getaways, family vacations, or special celebrations. More than just planning, we believe that each journey can transform a couple, mark a lifetime, or celebrate a new beginning. Each itinerary is crafted with soul, every detail created with intention, and every experience born from your story, your dreams, and your essence."}},{"@type":"Question","name":"Why should I choose Honeymooners over another agency?","acceptedAnswer":{"@type":"Answer","text":"Because we don’t just sell trips. We create exclusive, transformative experiences. We believe every couple is unique. Every dream, a universe. That’s why we don’t work with pre-made packages, automated responses, or generic itineraries. We listen carefully, understand your wishes, fears, and expectations, and turn all of that into a deeply personalized journey, with expert curation and constant support. We ensure memories that will last a lifetime."}},{"@type":"Question","name":"What is the advantage of booking a trip with Honeymooners instead of directly with a hotel or airline?","acceptedAnswer":{"@type":"Answer","text":"Booking directly may seem simpler, but it means giving up personalization, expert curation, and attention to detail. By choosing Honeymooners, you have access to our team, who deeply know the destinations, the right partners, and exclusive benefits. We support you before, during, and after the trip. Instead of wasting time comparing options or taking risks, you gain peace of mind, support, and an experience designed with intention, so everything goes as you dreamed."}},{"@type":"Question","name":"Does Honeymooners offer pre-defined travel packages?","acceptedAnswer":{"@type":"Answer","text":"We do not offer ready-made packages. Every trip is designed based on your story, your desires, and your profile. We believe that a truly memorable experience cannot be chosen from a catalog, it’s built with care, listening, and intention. Everything is done from scratch, so each moment carries your identity and not just a booking number."}},{"@type":"Question","name":"Does Honeymooners have a physical store?","acceptedAnswer":{"@type":"Answer","text":"We don’t have a physical store or in-person service. We have headquarters and offices in several parts of the world, but it’s online where we are truly close. We serve couples from every continent through personalized video calls, no rush, no counters, no lines. We believe that listening happens better when both sides are comfortable, and that a well-thought-out journey begins with quality time and real connection."}},{"@type":"Question","name":"Is Honeymooners only for honeymoons, or can I plan other types of trips?","acceptedAnswer":{"@type":"Answer","text":"No. Our story began with honeymoons, but today we accompany couples through all special moments. We organize romantic trips, family vacations, wedding anniversaries, babymoons, marriage proposals, and vow renewals. If you’re looking for a trip with intention, emotion, and personalization, you’re in the right place. Because more than the occasion, what matters is the meaning."}},{"@type":"Question","name":"Which destinations do you work with?","acceptedAnswer":{"@type":"Answer","text":"We don’t work with fixed destinations, we work with dreams. The starting point is not the map, it’s your story. Based on it, we suggest the right places: those that match your style, the moment you’re living, and what you want to feel. Some couples seek pure nature, like an exclusive safari in Tanzania or exotic landscapes in Indonesia. Others are drawn to the cultural richness of Japan, the sophistication of Italy, or the authentic energy of Mexico. Some dream of crystal-clear waters in the Maldives, Thailand, or Mauritius. And some choose the sophisticated charm of major urban destinations in the United States. Culture, nature, paradise, or adventure, the ideal destination is the one that tells your story without needing words."}},{"@type":"Question","name":"And if we want to avoid the obvious? Does Honeymooners have different suggestions?","acceptedAnswer":{"@type":"Answer","text":"Absolutely. We love it when we’re asked for something truly out of the ordinary. We have less predictable suggestions that are deeply memorable. A sunset among the baobabs in Madagascar. A lodge on the banks of the Zambezi River in Zambia. A spiritual retreat in the sacred mountains of Nepal. Or even an experience in the vineyards of Georgia, the wild beaches of Nicaragua, or a salt desert in Bolivia. Breaking away from the obvious is also a way of celebrating love, with originality, meaning, and stories no one else has."}},{"@type":"Question","name":"Which destinations do you offer?","acceptedAnswer":{"@type":"Answer","text":"We offer all the destinations that make sense for you. The starting point isn’t the destination, it’s your dream. For some, it may be a paradise beach in the Maldives. For others, a retreat in Indonesia, a safari in Tanzania, or the autumn poetry of Japan. We believe the world is vast, and the right trip is the one that fully reflects you."}},{"@type":"Question","name":"And if we don’t know where to start?","acceptedAnswer":{"@type":"Answer","text":"That’s more common than you might think, and it’s also one of the most beautiful parts of the process. When there’s no destination yet, we start by listening: who you are, what you like, what inspires you, how much time you have, what you want to celebrate. From there, we build together. We suggest destinations, travel styles, and experiences that align with who you are. We turn indecision into excitement, and doubt into discovery."}},{"@type":"Question","name":"How does the booking process with Honeymooners work?","acceptedAnswer":{"@type":"Answer","text":"It all begins with a conversation, because before we suggest any destination, we want to hear from you. We invite each couple to share their story, dreams, preferences, and expectations in a video call with us. Then, we propose a personalized trip based on your profile and the purpose of the celebration. If it makes sense to you, we proceed with the reservation confirmation, including all documentation, terms, and necessary support. We guide you every step of the way, until the day of departure and throughout the journey. Because a memorable trip begins with listening and is brought to life with care. To book, just fill out our form."}},{"@type":"Question","name":"Does Honeymooners help with trip arrangements such as flights and transfers?","acceptedAnswer":{"@type":"Answer","text":"Yes. We take care of everything, from flights and transfers to visas, activities, experiences, and the little details that make a big difference. Each stage is planned with precision so that everything aligns with your style and the purpose of the trip. We’re with you from the first step to your return home, to ensure everything flows smoothly, safely, and meaningfully."}},{"@type":"Question","name":"Does Honeymooners offer travel insurance?","acceptedAnswer":{"@type":"Answer","text":"Yes. We work with trusted partners to offer travel insurance tailored to your profile and chosen destination. More than a formality, insurance is part of our commitment to your peace of mind. From international medical coverage to protections for flights, luggage, or unforeseen events, we always recommend the most suitable option for your itinerary."}},{"@type":"Question","name":"Is the travel health consultation scheduled by us or Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"The travel consultation is scheduled by you, directly with the insurance provider, about 1 to 2 months before departure. The consultation is online, free, and optional. The contact is listed on the insurance certificate. If you need help, we’re always here to guide you."}},{"@type":"Question","name":"How far in advance should we start planning the trip?","acceptedAnswer":{"@type":"Answer","text":"Ideally, you should start planning 6 to 10 months in advance. This allows for more options in dates, flights, hotels, and experiences, especially during high-demand periods. Most importantly, it gives you space to dream without pressure and enjoy each stage of the process with calm, clarity, and excitement."}},{"@type":"Question","name":"Does Honeymooners handle check-in or do we?","acceptedAnswer":{"@type":"Answer","text":"Yes. As soon as online check-in is available through the airline, we take care of it for you. We send the boarding passes via email or WhatsApp so that you can focus only on what matters: taking off."}},{"@type":"Question","name":"How can I be sure that my trip will be safe and well planned with Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"Because we combine emotion with precision in every detail. Behind every trip is an experienced team, with access to trusted partners around the world. We guarantee not only authenticity and quality but also safety at every step. Before departure, we validate all services and review every link in the itinerary. During the trip, you’ll have access to our 24/7 support, human, close, and ready to act. Traveling with us means knowing that someone is always looking after you, supporting you, and ensuring everything happens as it should: with ease, comfort, and peace of mind."}},{"@type":"Question","name":"How do you ensure the trip goes as we dreamed?","acceptedAnswer":{"@type":"Answer","text":"We always start by listening. We believe that only after truly understanding can we create a trip that reflects who you are. We design every experience with intention, curation, and attention to detail, and only work with partners we trust. We review everything before departure, validate services on the ground, and provide close follow-up. During the trip, you’ll have a dedicated Customer Experience Specialist available 24/7 to protect every moment and anticipate any need. Because dreaming is the beginning, but what matters is living something even better."}},{"@type":"Question","name":"And what if something goes wrong during the trip?","acceptedAnswer":{"@type":"Answer","text":"Unforeseen events can happen. But with us, you’re never alone. If something doesn’t go as planned, your Customer Experience Specialist will be available to act, at any time, anywhere. We work with a network of local partners with quick response capabilities, and all our trips include insurance, selected based on your profile and needs. Everything is prepared in advance, with room for flexibility and fast solutions. Because your peace of mind is always the priority."}},{"@type":"Question","name":"Does Honeymooners provide support during the trip?","acceptedAnswer":{"@type":"Answer","text":"Yes. From the moment you confirm your reservation until your return, you’ll have the support of someone dedicated to your journey. This support is human, available 24/7, and always attentive to the details, whether to make real-time adjustments or simply to ensure everything is going smoothly. And even from afar, you’ll always have someone by your side, with care, empathy, and readiness."}},{"@type":"Question","name":"We’d like to request a quote. How should we proceed?","acceptedAnswer":{"@type":"Answer","text":"It’s simple. Just fill out the form on our website with a few details about the type of trip you’re looking for, dates, ideal destination (or still undecided), estimated budget, and what inspires you most. Once we receive your request, we’ll get in touch to schedule a video call. That conversation is the starting point for us to get to know your story and begin building the perfect trip together."}},{"@type":"Question","name":"What is included in the trip quote?","acceptedAnswer":{"@type":"Answer","text":"Each quote is unique, just like every couple. The proposal we send may include flights, accommodation, transfers, experiences, activities, travel insurance, and all the necessary services to ensure a smooth and memorable journey. Everything is thoughtfully designed according to your profile and what you want to experience, with complete transparency from the very beginning."}},{"@type":"Question","name":"How does the payment process work?","acceptedAnswer":{"@type":"Answer","text":"Payment is made securely and flexibly, with different methods available. During the booking process, we explain all the options and deadlines so that you can choose what works best for you. Most importantly: everything is handled with clarity, professionalism, and close support."}},{"@type":"Question","name":"When is the invoice issued?","acceptedAnswer":{"@type":"Answer","text":"The invoice or receipt is issued within 3 business days after payment and sent to the email you provided during the booking process. If you can’t find it, we recommend checking your spam folder. If you still haven’t received it, just ask, and we’ll happily resend it."}},{"@type":"Question","name":"Where can we find the insurance certificates?","acceptedAnswer":{"@type":"Answer","text":"The insurance certificates are sent along with your travel confirmation email. If you can’t find them or need them again, we’re always available to resend them. Just let us know, and we’ll take care of it."}},{"@type":"Question","name":"When will the After-Sales team contact us?","acceptedAnswer":{"@type":"Answer","text":"The timing of our contact depends on how far in advance your trip is. If your departure is within 120, 90, 60, or 30 days, there are specific contact points to schedule activities, confirm services, or handle visas and documentation. Everything is planned with care, so that you have time, peace of mind, and a team always close by, supporting each step."}},{"@type":"Question","name":"Does Honeymooners handle the check-in?","acceptedAnswer":{"@type":"Answer","text":"Yes. As soon as online check-in is available from the airline, we take care of it for you. We send the boarding passes via email or WhatsApp, so you don’t have to worry about anything and can enjoy the day before your trip with ease."}},{"@type":"Question","name":"Is the travel health consultation scheduled by us or by you?","acceptedAnswer":{"@type":"Answer","text":"The travel health consultation is scheduled directly by you with the insurance provider, about 1 to 2 months before your trip. The consultation is online, free, and optional. The contact details are on the insurance certificate, but if you need help, you can count on us to guide you."}},{"@type":"Question","name":"What if we have last-minute questions?","acceptedAnswer":{"@type":"Answer","text":"We’re always nearby. Throughout the entire process, and especially in the days leading up to your trip, you can contact us via WhatsApp or email. We want you to travel with confidence, so no question will go unanswered."}},{"@type":"Question","name":"What opportunities are currently open?","acceptedAnswer":{"@type":"Answer","text":"You can check all available opportunities on our official LinkedIn profile. There, we share all job openings and team updates."}},{"@type":"Question","name":"How can you submit your application?","acceptedAnswer":{"@type":"Answer","text":"Simply send your application to hr@honeymooners.travel. In the subject line of your email, include the name of the position you’re applying for. We look forward to getting to know you better."}},{"@type":"Question","name":"Do you accept spontaneous applications?","acceptedAnswer":{"@type":"Answer","text":"Yes! If you feel you have something to add to our team, even if there isn’t an open position at the moment, send your CV to hr@honeymooners.travel with the subject “Spontaneous Application.”"}},{"@type":"Question","name":"How does your selection process work?","acceptedAnswer":{"@type":"Answer","text":"We look for people who identify with our culture, vision, and way of being in the world. The process may vary depending on the role, but it usually includes: • CV screening • Interview with HR • Technical or leadership interview • Final feedback or offer"}},{"@type":"Question","name":"Were you a team member and need a reference or work statement?","acceptedAnswer":{"@type":"Answer","text":"Send us an email at hr@honeymooners.travel with your request. We’ll take care of it with care and speed."}},{"@type":"Question","name":"Need your income statement (for taxes)?","acceptedAnswer":{"@type":"Answer","text":"Statements are sent automatically, but if you haven’t received yours, email us at hr@honeymooners.travel, we’ll sort it out right away."}},{"@type":"Question","name":"Do you have a commercial proposal related to HR?","acceptedAnswer":{"@type":"Answer","text":"If you have a proposal that could add value to our culture or people development, send it to hr@honeymooners.travel. We’re always open to good ideas."}},{"@type":"Question","name":"How can I contact Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"We’re available through the form on our website. Just fill it out with your details and message, and we’ll get back to you as soon as possible."}},{"@type":"Question","name":"Where can we follow Honeymooners news and updates?","acceptedAnswer":{"@type":"Answer","text":"We share our latest news, behind-the-scenes content, real stories, and travel inspiration on social media and in our monthly newsletter. Follow us on Instagram and LinkedIn to stay up to date."}},{"@type":"Question","name":"Is Honeymooners active on social media?","acceptedAnswer":{"@type":"Answer","text":"Yes. You can find us here: Instagram LinkedIn Each platform offers a glimpse into our universe, filled with real stories, emotion, and meaningful travel."}},{"@type":"Question","name":"Does the team reply via WhatsApp or only by email?","acceptedAnswer":{"@type":"Answer","text":"Yes, we also communicate via WhatsApp. Most initial contact is made by email, but after your booking, we’re always available on both channels."}}]}</script>
