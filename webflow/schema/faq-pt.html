<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","url":"https://www.honeymooners.travel/pt/policies/faq","inLanguage":"pt-PT","about":{"@id":"https://www.honeymooners.travel/#organization"},"mainEntity":[{"@type":"Question","name":"O que é a Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"Somos uma agência de viagens especializada em criar experiências personalizadas para casais em lua de mel, férias a dois, em família ou celebrações especiais. Mais do que planear, acreditamos que cada viagem pode transformar um casal, marcar uma vida, celebrar um recomeço. Cada itinerário é pensado com alma, cada detalhe criado com intenção, e cada experiência nasce da vossa história, dos vossos sonhos e da vossa essência."}},{"@type":"Question","name":"Porque devo escolher a Honeymooners e não outra agência?","acceptedAnswer":{"@type":"Answer","text":"Porque não vendemos apenas viagens. Criamos experiências exclusivas e transformadoras. Acreditamos que cada casal é único. Cada sonho, um universo. É por isso que não trabalhamos com pacotes prontos, respostas automáticas ou itinerários genéricos. Escutamos com atenção, compreendemos os vossos desejos, medos e expectativas, e transformamos tudo numa viagem profundamente personalizada, com curadoria especializada e acompanhamento constante. Garantimos memórias que ficam gravadas para sempre."}},{"@type":"Question","name":"Qual é a vantagem de reservar uma viagem com a Honeymooners em vez de reservar diretamente com um hotel ou companhia aérea?","acceptedAnswer":{"@type":"Answer","text":"Reservar diretamente pode parecer mais simples, mas significa abdicar da personalização, da curadoria especializada e do cuidado em cada detalhe. Ao escolherem a Honeymooners, têm acesso à nossa equipa, que conhece profundamente os destinos, os parceiros certos e os benefícios exclusivos. Acompanhamos-vos antes, durante e depois da viagem. Em vez de perderem tempo com comparações ou riscos, ganham tranquilidade, apoio e uma experiência pensada com intenção, para que tudo corra como sonharam."}},{"@type":"Question","name":"A Honeymooners oferece pacotes de viagem pré-definidos?","acceptedAnswer":{"@type":"Answer","text":"Não oferecemos pacotes prontos. Cada viagem é desenhada com base na vossa história, nos vossos desejos e no vosso perfil. Acreditamos que uma experiência verdadeiramente memorável não se escolhe de um catálogo, constrói-se com cuidado, escuta e intenção. Tudo é feito de raiz, para que cada momento tenha a vossa identidade e não apenas um número de reserva."}},{"@type":"Question","name":"A Honeymooners tem loja física?","acceptedAnswer":{"@type":"Answer","text":"Não temos loja física nem fazemos atendimento presencial. Temos sede e escritórios em várias partes do mundo, mas é no digital que estamos verdadeiramente próximos. Atendemos casais de todos os continentes através de videochamadas personalizadas, sem pressa, sem balcões, sem filas. Acreditamos que a escuta acontece melhor quando há conforto dos dois lados, e que uma viagem bem pensada começa com tempo de qualidade e conexão real."}},{"@type":"Question","name":"A Honeymooners é só para luas de mel ou posso planear outro tipo de viagem?","acceptedAnswer":{"@type":"Answer","text":"Não. A nossa história começou com luas de mel, mas hoje acompanhamos casais em todos os momentos especiais. Organizamos viagens românticas, férias em família, aniversários de casamento, babymoons, pedidos de casamento e renovações de votos. Se procuram uma viagem com intenção, emoção e personalização, estão no lugar certo. Porque mais do que a ocasião, importa o significado."}},{"@type":"Question","name":"Com que destinos trabalhamos?","acceptedAnswer":{"@type":"Answer","text":"Não trabalhamos com destinos fixos, trabalhamos com sonhos. O ponto de partida não é o mapa, é a vossa história. É com base nela que sugerimos os lugares certos: aqueles que combinam com o vosso estilo, o momento que estão a viver e aquilo que querem sentir. Alguns casais procuram natureza em estado puro, como um safári exclusivo na Tanzânia ou paisagens exóticas na Indonésia. Outros sentem-se atraídos pela riqueza cultural do Japão, pela sofisticação de Itália ou pela energia autêntica do México. Há quem deseje um paraíso de águas cristalinas nas Maldivas, na Tailândia ou nas Maurícias. E também quem escolha o encanto sofisticado dos grandes destinos urbanos nos Estados Unidos da América. Cultura, natureza, paraíso ou aventura, o destino ideal é aquele que conta a vossa história sem precisar de palavras."}},{"@type":"Question","name":"E se quisermos fugir ao óbvio? A Honeymooners tem sugestões diferentes?","acceptedAnswer":{"@type":"Answer","text":"Claro que sim. Adoramos quando nos pedem algo verdadeiramente fora do comum. Temos sugestões menos previsíveis, mas profundamente memoráveis. Um pôr-do-sol entre os baobás em Madagáscar. Um lodge nas margens do rio Zambeze, na Zâmbia. Um retiro espiritual entre montanhas sagradas no Nepal. Ou até uma experiência nas vinhas da Geórgia, nas praias selvagens da Nicarágua ou num deserto de sal na Bolívia. Fugir ao óbvio também é uma forma de celebrar o amor, com originalidade, significado e histórias que ninguém mais tem."}},{"@type":"Question","name":"Quais são os destinos que oferecem?","acceptedAnswer":{"@type":"Answer","text":"Oferecemos todos os destinos que fizerem sentido para vocês. O ponto de partida não é o destino, é o vosso sonho. Para alguns, pode ser uma praia paradisíaca nas Maldivas. Para outros, um retiro na Indonésia, um safari pela Tanzânia ou a poesia outonal do Japão. Acreditamos que o mundo é vasto, e a viagem certa é aquela que vos reflete por inteiro."}},{"@type":"Question","name":"E se não soubermos por onde começar?","acceptedAnswer":{"@type":"Answer","text":"É mais comum do que parece, e é também uma das partes mais bonitas do processo. Quando ainda não há um destino, começamos por vos ouvir: quem são, o que gostam, o que vos inspira, quanto tempo têm, o que querem celebrar. A partir daí, construímos juntos. Sugerimos destinos, estilos de viagem e experiências que fazem sentido com quem vocês são. Transformamos indecisão em entusiasmo, e dúvida em descoberta."}},{"@type":"Question","name":"Como funciona o processo de reserva com a Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"Como funciona o processo de reserva com a Honeymooners? Tudo começa com uma conversa, porque antes de sugerirmos qualquer destino, queremos ouvir-vos. Convidamos cada casal a partilhar a sua história, os seus sonhos, preferências e expectativas numa videochamada connosco. Depois, propomos uma viagem personalizada, criada com base no vosso perfil e no propósito da celebração. Se fizer sentido para vocês, seguimos para a confirmação da reserva com toda a documentação, condições e apoio necessário. Acompanhamos-vos em cada passo, até ao dia da partida e durante toda a viagem. Porque uma viagem marcante começa com escuta, e concretiza-se com cuidado. Para reservarem, preencham o nosso formulário."}},{"@type":"Question","name":"A Honeymooners ajuda com os preparativos da viagem, como voos e transferências?","acceptedAnswer":{"@type":"Answer","text":"Sim. Tratamos de tudo, desde voos e transfers até vistos, atividades, experiências e detalhes que fazem toda a diferença. Cada etapa é planeada com rigor, para que tudo esteja alinhado com o vosso estilo e com o propósito da viagem. Estamos convosco do primeiro passo ao regresso a casa, para garantir que tudo decorre com fluidez, segurança e significado."}},{"@type":"Question","name":"A Honeymooners oferece seguro de viagem?","acceptedAnswer":{"@type":"Answer","text":"Sim. Trabalhamos com parceiros de confiança para vos oferecer seguros de viagem adaptados ao vosso perfil e ao destino escolhido. Mais do que uma formalidade, o seguro faz parte do nosso compromisso com a vossa tranquilidade. Desde proteção médica internacional até coberturas para voos, bagagens ou imprevistos, recomendamos sempre o mais adequado ao vosso itinerário."}},{"@type":"Question","name":"A consulta do viajante é marcada por nós ou pela Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"A marcação da consulta do viajante é feita por vocês, diretamente com a seguradora, cerca de 1 a 2 meses antes da partida. A consulta é online, gratuita e facultativa. O contacto está indicado no certificado do seguro. Se precisarem de ajuda, estamos sempre aqui para orientar."}},{"@type":"Question","name":"Com quanto tempo de antecedência devemos começar a planear a viagem?","acceptedAnswer":{"@type":"Answer","text":"O ideal é começarem com 6 a 10 meses de antecedência. Isso permite mais opções de datas, voos, hotéis e experiências, sobretudo em épocas de alta procura. E acima de tudo, dá-vos espaço para sonhar sem pressa e viver cada etapa do processo com calma, clareza e entusiasmo."}},{"@type":"Question","name":"É a Honeymooners que realiza o check-in ou somos nós?","acceptedAnswer":{"@type":"Answer","text":"Sim. Assim que o check-in estiver disponível pela companhia aérea, tratamos de tudo por vocês. Enviamos os cartões de embarque por email ou WhatsApp, para que possam concentrar-se apenas no que importa: partir."}},{"@type":"Question","name":"Como posso ter certeza de que a minha viagem será segura e bem planeada com a Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"Porque combinamos emoção com precisão em cada detalhe. Por detrás de cada viagem está uma equipa experiente, com acesso a parceiros de confiança em todo o mundo. Garantimos não só autenticidade e qualidade, mas também segurança em cada etapa. Antes da partida, validamos todos os serviços e revemos cada ligação do itinerário. Durante a viagem, têm acesso ao nosso apoio 24 horas por dia, humano, próximo e preparado para agir. Viajar connosco é ter a certeza de que há sempre alguém a cuidar, a acompanhar e a garantir que tudo acontece como deve ser: com leveza, conforto e tranquilidade."}},{"@type":"Question","name":"Como garantem que a viagem corre como sonhámos?","acceptedAnswer":{"@type":"Answer","text":"Começamos sempre por vos ouvir. Acreditamos que só depois de uma boa escuta é possível criar uma viagem à vossa imagem. Desenhamos cada experiência com intenção, curadoria e atenção ao detalhe, e só trabalhamos com parceiros em quem confiamos. Revemos tudo antes da partida, validamos serviços no terreno e acompanhamos de perto. Durante a viagem, têm um Customer Experience Specialist dedicado, disponível 24h por dia, para proteger cada momento e antecipar qualquer necessidade. Porque sonhar é o começo, o importante é viver algo ainda melhor."}},{"@type":"Question","name":"E se algo correr mal durante a viagem?","acceptedAnswer":{"@type":"Answer","text":"Imprevistos acontecem. Mas connosco, nunca estão sozinhos. Se algo não correr como planeado, o vosso Customer Experience Specialist estará disponível para agir, a qualquer hora, em qualquer lugar. Trabalhamos com uma rede de parceiros locais com resposta rápida e todas as nossas viagens incluem seguro, escolhido com base no vosso perfil e necessidades. Tudo é preparado com antecedência, com margem para adaptação e soluções rápidas. Porque a vossa paz de espírito é sempre prioridade."}},{"@type":"Question","name":"A Honeymooners oferece suporte durante a viagem?","acceptedAnswer":{"@type":"Answer","text":"Sim. Desde o momento em que confirmam a reserva até ao vosso regresso, têm o acompanhamento de uma pessoa dedicada ao vosso processo. Esse suporte é humano, disponível 24h por dia e sempre atento aos detalhes, seja para ajustar algo em tempo real ou apenas garantir que tudo está a correr bem. E mesmo longe, terão sempre alguém do vosso lado, com cuidado, empatia e prontidão."}},{"@type":"Question","name":"Queremos pedir um orçamento. Como devemos fazer?","acceptedAnswer":{"@type":"Answer","text":"É simples. Basta preencherem o formulário no nosso site com alguns detalhes sobre o tipo de viagem que procuram, datas, destino ideal (ou ainda por descobrir), orçamento indicativo e o que mais vos inspira. Assim que recebermos o pedido, entramos em contacto para agendar uma videochamada. Essa conversa é o ponto de partida para conhecermos a vossa história e começarmos a construir juntos a viagem perfeita."}},{"@type":"Question","name":"O que está incluído no orçamento da viagem?","acceptedAnswer":{"@type":"Answer","text":"Cada orçamento é único, tal como cada casal. A proposta que vos enviamos pode incluir voos, alojamento, transfers, experiências, atividades, seguro de viagem e todos os serviços necessários para garantir uma viagem tranquila e marcante. Tudo será pensado com intenção, de acordo com o vosso perfil e com aquilo que querem viver, com total transparência desde o início."}},{"@type":"Question","name":"Como funciona o pagamento da viagem?","acceptedAnswer":{"@type":"Answer","text":"O pagamento é feito de forma segura e flexível, com diferentes métodos disponíveis. Durante o processo de reserva, explicamos todas as opções e prazos, para que possam escolher o que fizer mais sentido para vocês. O mais importante: tratamos de tudo com clareza, profissionalismo e acompanhamento próximo."}},{"@type":"Question","name":"Quando é emitida a fatura?","acceptedAnswer":{"@type":"Answer","text":"A fatura ou recibo é emitida até 3 dias úteis após o pagamento e enviada para o email que indicaram no processo de reserva. Se não a encontrarem, recomendamos verificar a pasta de spam. Caso ainda assim não a tenham recebido, basta pedirem, e reencaminhamos com gosto."}},{"@type":"Question","name":"Onde podemos encontrar os certificados do seguro?","acceptedAnswer":{"@type":"Answer","text":"Os certificados do seguro são enviados juntamente com o email de confirmação da vossa viagem. Se não os encontrarem ou precisarem novamente, estamos sempre disponíveis para reencaminhar. É só pedir, e nós tratamos do resto."}},{"@type":"Question","name":"Quando é que o Pós-Venda entra em contacto connosco?","acceptedAnswer":{"@type":"Answer","text":"O momento em que entram em contacto convosco depende da antecedência da vossa viagem. Se estiverem a menos de 120, 90, 60 ou 30 dias da partida, existem pontos de contacto específicos para agendar atividades, confirmar serviços ou tratar de vistos e documentação. Tudo é planeado com cuidado, para que tenham tempo, tranquilidade e uma equipa sempre próxima a acompanhar cada passo."}},{"@type":"Question","name":"É a Honeymooners que trata do check-in?","acceptedAnswer":{"@type":"Answer","text":"Sim. Assim que o check-in estiver disponível pela companhia aérea, tratamos de tudo por vocês. Enviamos os cartões de embarque por email ou WhatsApp, para que não tenham de se preocupar com nada e possam simplesmente aproveitar a véspera da viagem com leveza."}},{"@type":"Question","name":"A consulta do viajante é marcada por nós ou por vocês?","acceptedAnswer":{"@type":"Answer","text":"A marcação da consulta do viajante é feita diretamente por vocês junto da seguradora, cerca de 1 a 2 meses antes da viagem. A consulta é online, gratuita e facultativa. O contacto está no certificado do seguro, mas, se precisarem de ajuda, podem contar connosco para vos orientar."}},{"@type":"Question","name":"E se surgirem dúvidas de última hora?","acceptedAnswer":{"@type":"Answer","text":"Estamos sempre por perto. Durante todo o processo, e especialmente nos dias que antecedem a viagem, podem entrar em contacto connosco por WhatsApp ou email. Queremos que viajem com confiança, por isso, nenhuma dúvida fica por esclarecer."}},{"@type":"Question","name":"Como podes submeter a tua candidatura?","acceptedAnswer":{"@type":"Answer","text":"Basta enviares a tua candidatura para hr@honeymooners.travel. No assunto do email, indica o nome da oportunidade a que te queres candidatar. Queremos conhecer-te melhor."}},{"@type":"Question","name":"Aceitamos candidaturas espontâneas?","acceptedAnswer":{"@type":"Answer","text":"Sim! Se sentes que tens algo a acrescentar à nossa equipa, mesmo que não haja uma vaga aberta no momento, envia o teu CV para hr@honeymooners.travel com o assunto “Candidatura Espontânea”."}},{"@type":"Question","name":"Como funciona o nosso processo de seleção?","acceptedAnswer":{"@type":"Answer","text":"Procuramos pessoas que se identifiquem com a nossa cultura, visão e forma de estar no mundo. O processo pode variar conforme a função, mas normalmente inclui: • Triagem curricular • Entrevista com RH • Entrevista técnica ou com liderança • Feedback final ou proposta"}},{"@type":"Question","name":"Foste colaborador/a e precisas de uma declaração ou carta de referência?","acceptedAnswer":{"@type":"Answer","text":"Envia-nos um email para hr@honeymooners.travel com o teu pedido. Vamos tratar disso com carinho e rapidez."}},{"@type":"Question","name":"Precisas da tua declaração de rendimentos (IRS)?","acceptedAnswer":{"@type":"Answer","text":"As declarações são enviadas automaticamente, mas se não a tiveres recebido, escreve-nos para hr@honeymooners.travel, resolvemos isso num instante."}},{"@type":"Question","name":"Tens uma proposta comercial na área de RH?","acceptedAnswer":{"@type":"Answer","text":"Se tens uma proposta que pode acrescentar valor à nossa cultura ou desenvolvimento de pessoas, envia para hr@honeymooners.travel. Estamos sempre abertos a boas ideias."}},{"@type":"Question","name":"Como posso contactar a Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"Estamos disponíveis através do formulário no nosso site. Basta preencherem com os vossos dados e mensagem, e entraremos em contacto o mais rapidamente possível."}},{"@type":"Question","name":"Onde podemos acompanhar as novidades da Honeymooners?","acceptedAnswer":{"@type":"Answer","text":"Partilhamos as nossas novidades, bastidores, histórias reais e inspirações de viagem nas redes sociais e na nossa newsletter mensal. Sigam-nos no Instagram e LinkedIn para estarem sempre por dentro."}},{"@type":"Question","name":"A Honeymooners está presente nas redes sociais?","acceptedAnswer":{"@type":"Answer","text":"Sim. Podem encontrar-nos aqui: Instagram LinkedIn Cada canal mostra um pouco do nosso universo, feito de histórias reais, emoção e viagens com significado."}},{"@type":"Question","name":"A equipa responde por WhatsApp ou só por email?","acceptedAnswer":{"@type":"Answer","text":"Sim, também comunicamos por WhatsApp. A maioria dos primeiros contactos é feita por email, mas depois da reserva, estamos sempre disponíveis nos dois canais."}}]}</script>
